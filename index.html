<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://geoserveis.icgc.cat; connect-src 'self' https://eines.icgc.cat https://www.cartociudad.es https://nominatim.openstreetmap.org https://api.heigit.org https://api.tomtom.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ruta Escolà</title>
  <meta name="description" content="Planifica y optimiza la ruta de reparto con tráfico y horarios de entrega.">
  <meta name="theme-color" content="#0a0b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/parse.js">
  <link rel="modulepreload" href="js/geo.js">
  <link rel="modulepreload" href="js/planner.js">
  <link rel="modulepreload" href="js/solver.js">
  <link rel="modulepreload" href="js/store.js">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M17 14h14v3H21v5.5h8.5v3H21V31h10v3H17z" fill="currentColor"/>
      </svg>
      <div>
        <div class="eyebrow">Escolà · Reparto</div>
        <h1 id="title">Ruta</h1>
      </div>
    </div>
    <button id="engine" class="engine" data-action="tab" data-tab="settings"></button>
  </header>

  <div id="update" class="update" role="status" hidden></div>

  <main id="view" tabindex="-1"></main>

  <div id="actionbar" class="actionbar" hidden></div>

  <nav class="tabs" aria-label="Secciones">
    <button data-action="tab" data-tab="route" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm12-10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM6 15V9a3 3 0 0 1 3-3h3m6 3v6a3 3 0 0 1-3 3h-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Ruta</span>
    </button>
    <button data-action="tab" data-tab="clients" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Clientes</span>
    </button>
    <button data-action="tab" data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="ask" class="ask-wrap" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
