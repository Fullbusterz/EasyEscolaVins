# Publica la web en GitHub Pages con las claves de rutas sacadas de los secretos del repositorio.
# Así la clave no está en el código (el repositorio es público y hay robots que buscan claves en GitHub).
#
# Para usarlo, una vez: Settings → Pages → Source: «GitHub Actions», los secretos TOMTOM_KEY y ORS_KEY y la variable
# PUBLICAR_CON_ACTIONS = si (Settings → Secrets and variables → Actions → Variables). Mientras la variable no
# esté, al subir cambios no hace nada (se puede lanzar a mano desde Actions).
name: Publicar la web

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || (vars.PUBLICAR_CON_ACTIONS == 'si' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests de la app
        run: npm test

      - name: Preparar la web con la clave
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          ORS_KEY: ${{ secrets.ORS_KEY }}
        run: |
          mkdir _site
          cp -r index.html privacidad.html manifest.webmanifest sw.js .nojekyll .well-known css js data icons vendor _site/
          node tools/put-keys.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
