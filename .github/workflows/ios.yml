# La app de iPhone: se compila en un Mac de GitHub y se sube a TestFlight, sin Mac propio.
# Se lanza a mano (Actions → «App de iPhone» → Run workflow) o al subir una etiqueta ios-v*.
# Antes hace falta, una sola vez, lo de native/LEEME.md: cuenta de Apple Developer, la app creada en
# App Store Connect y los secretos de Apple y de rutas en el repositorio.
name: App de iPhone (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26  # Apple exige compilar con Xcode 26 o posterior para subir a TestFlight
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      ORS_KEY: ${{ secrets.ORS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que están los secretos
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan estos secretos del repositorio:$missing. Mira native/LEEME.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests de la app
        run: npm test

      - name: Meter la web dentro de la app
        working-directory: native
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node ../tools/put-keys.mjs www
          npx cap sync ios

      - name: Versión
        id: version
        run: |
          v=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" sw.js)
          echo "marketing=$v" >> "$GITHUB_OUTPUT"
          echo "Versión $v, compilación ${{ github.run_number }}"

      - name: Clave de App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          f="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # Se rehace el archivo con el formato exacto que pide Xcode, aunque el secreto se haya pegado
          # con saltos de línea de Windows, espacios de más o sin las líneas BEGIN/END.
          cuerpo=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\n')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$cuerpo" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$f"
          if ! openssl pkey -in "$f" -noout 2>/dev/null; then
            echo "::error::El secreto ASC_KEY_P8 no es una clave válida. Ábrelo con el Bloc de notas, copia todo el archivo .p8 (con las líneas BEGIN y END) y vuelve a pegarlo en GitHub."
            exit 1
          fi
          echo "Clave .p8 correcta"

      # Se compila sin firmar: firmar aquí pediría un perfil de desarrollo, y ese exige tener un iPhone
      # registrado en la cuenta. La firma de App Store se pone al exportar (paso siguiente).
      - name: Compilar
        working-directory: native/ios/App
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ruta.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Firmar y subir a TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ruta.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Subida. En unos minutos sale en App Store Connect → TestFlight."

      - name: Borrar la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
